<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasza Biblioteka</title>
    <!-- Ikona w zakładce przeglądarki (Favicon) -->
    <link rel="icon" type="image/png" href="sowa.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Główne logo strony -->
    <img src="logo.png" alt="Logo Lubimy Czytać" class="main-logo">

    <h1>System zarządzania książkami</h1>

    <!-- Formularz do dodawania nowej książki -->
    <section>
        <h2>Dodaj nową książkę</h2>
        <input type="text" id="title" placeholder="Tytuł książki">
        <input type="text" id="author" placeholder="Autor">
        <input type="text" id="description" placeholder="Opis książki">
        <button onclick="addBook()">Dodaj książkę</button>
    </section>

    <!-- Sekcja listy książek pobieranych z bazy danych -->
    <section>
        <h2>Lista książek</h2>
        <ul id="books-list">
            <!-- Tutaj JavaScript będzie dynamicznie wstawiać elementy -->
        </ul>
    </section>

    <!-- Dołączenie biblioteki Supabase oraz skryptu z logiką -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="script.js"></script>
</body>
</html>
